name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Runners are ephemeral, so the incremental-compilation cache is never reused
  # across runs — it is pure disk/IO overhead here. One-shot full builds only.
  CARGO_INCREMENTAL: "0"

jobs:
  symbolic-import:
    name: Symbolic source parser laws
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned parser tools
        run: |
          python3 -m venv "$RUNNER_TEMP/symbolic-parser"
          "$RUNNER_TEMP/symbolic-parser/bin/python" -m pip install -r scripts/audio/requirements-symbolic.txt
      - name: Test symbolic observations and unsupported-input rejection
        run: '"$RUNNER_TEMP/symbolic-parser/bin/python" -m unittest discover -s scripts/audio -p test_import_symbolic.py'

  python-wire:
    name: Python wire conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The wire protocol is cross-language, so CI must run BOTH halves — not only the
      # Rust side against a checked-in fixture. The bindings/python wire code is stdlib
      # only (no venv or deps), so the system python3 is enough.
      - name: Run the Python wire protocol tests
        run: |
          python3 bindings/python/test_wire.py > "$RUNNER_TEMP/wire_out.txt"
          cat "$RUNNER_TEMP/wire_out.txt"
          # Guard against a silently-emptied suite: require a non-zero passed count.
          grep -qE "all [1-9][0-9]* python wire conformance checks passed" "$RUNNER_TEMP/wire_out.txt"
      - name: Golden vector is freshly reproduced by the current producer (not historical)
        run: |
          python3 bindings/python/producer.py --golden > "$RUNNER_TEMP/golden_fresh.bin"
          cmp "$RUNNER_TEMP/golden_fresh.bin" bindings/python/testdata/golden_field_v1.bin

  rust:
    name: Rust (fmt, clippy, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # The `--all-features` clippy pass below enables the OPTIONAL `audio-cpal` backend,
      # which links ALSA on Linux (cpal -> alsa-sys, a pkg-config build script). The
      # mandatory build and `cargo test` use default features and need none of this; only
      # the all-features completeness check does, so the dev headers live here.
      - name: Install ALSA dev headers (for the optional audio-cpal feature)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build examples (fresh binaries for PTY/golden tests)
        run: cargo build --examples

      - name: Test
        run: cargo test

      - name: FX Lab generator tests
        run: cargo test --example fx_lab

      - name: Semantic UI example tests
        # Example-local interaction and visible-control regressions are outside
        # the default `cargo test` suite. Build-only coverage is insufficient.
        run: cargo test --example skin_gallery --example polished_agent_ui --example ui_showcase --example large_collection

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps

      - name: Build release
        run: |
          cargo build --release
          # The cdylib carries an ELF SONAME of libgibson.so.1 (build.rs), so a
          # consumer that links the in-tree build output records NEEDED=libgibson.so.1
          # and needs that name present at runtime. The staged SDK ships the symlink;
          # mirror it next to the raw build output for in-tree C/C++ linkers.
          ln -sf libgibson.so target/release/libgibson.so.1

      - name: ABI baseline and package sanity
        run: |
          scripts/release/check-abi.sh
          cargo package --list --locked > /dev/null

  bindings:
    name: Bindings (C, C++, Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build release
        run: |
          cargo build --release
          # The cdylib carries an ELF SONAME of libgibson.so.1 (build.rs), so a
          # consumer that links the in-tree build output records NEEDED=libgibson.so.1
          # and needs that name present at runtime. The staged SDK ships the symlink;
          # mirror it next to the raw build output for in-tree C/C++ linkers.
          ln -sf libgibson.so target/release/libgibson.so.1

      - name: C example
        run: |
          gcc -Iinclude bindings/c/example.c -Ltarget/release -lgibson -Wl,-rpath,"$GITHUB_WORKSPACE/target/release" -o /tmp/example_c
          /tmp/example_c

      - name: C++ example
        run: |
          g++ -std=c++17 -Iinclude bindings/cpp/example.cpp -Ltarget/release -lgibson -Wl,-rpath,"$GITHUB_WORKSPACE/target/release" -o /tmp/example_cpp
          /tmp/example_cpp

      - name: Python ctypes example
        env:
          PYTHONPATH: bindings/python
          LIBGIBSON_LIBRARY: ${{ github.workspace }}/target/release/libgibson.so
        run: python3 bindings/python/example.py

      - name: FFI behavioral stats parity (C vs Python vs native golden)
        # Drive one non-TTY plain-scrollback op-script through the C ABI and the Python ctypes
        # binding, and require byte-identical engine accounting + committed wire stream across
        # both AND against the committed golden that the Rust job verifies from the native API.
        # Proves the bindings marshal into the same engine (not pixel/full-feature parity; #142).
        env:
          PYTHONPATH: bindings/python
          LIBGIBSON_LIBRARY: ${{ github.workspace }}/target/release/libgibson.so
        run: |
          set -euo pipefail
          gcc -Iinclude bindings/parity/parity.c -Ltarget/release -lgibson \
            -Wl,-rpath,"$GITHUB_WORKSPACE/target/release" -o /tmp/parity_c
          /tmp/parity_c "$RUNNER_TEMP/c_stats.txt" "$RUNNER_TEMP/c_wire.txt"
          python3 bindings/parity/parity.py "$RUNNER_TEMP/py_stats.txt" "$RUNNER_TEMP/py_wire.txt"
          echo "--- C stats ---"; cat "$RUNNER_TEMP/c_stats.txt"
          echo "--- C wire ---"; cat "$RUNNER_TEMP/c_wire.txt"
          cmp "$RUNNER_TEMP/c_stats.txt" "$RUNNER_TEMP/py_stats.txt"
          cmp "$RUNNER_TEMP/c_stats.txt" bindings/parity/golden_stats.txt
          cmp "$RUNNER_TEMP/c_wire.txt" "$RUNNER_TEMP/py_wire.txt"
          cmp "$RUNNER_TEMP/c_wire.txt" bindings/parity/golden_wire.txt

      - name: FFI pixel/ANSI frame parity (C vs Python vs native golden)
        # Drive one headless frame op-script (an RGB-styled, bold text node) through the new C ABI
        # (gibson_create_headless_context + gibson_get_rendered_output) and the Python binding, and
        # require a byte-identical painted ANSI frame + painted stats across both AND against the
        # committed golden the Rust job verifies from the native API. Closes the Gate H pixel/ANSI
        # cede (#142, v0.6 Gate I); still not a pixel raster or full-feature parity.
        env:
          PYTHONPATH: bindings/python
          LIBGIBSON_LIBRARY: ${{ github.workspace }}/target/release/libgibson.so
        run: |
          set -euo pipefail
          gcc -Iinclude bindings/parity/parity_ansi.c -Ltarget/release -lgibson \
            -Wl,-rpath,"$GITHUB_WORKSPACE/target/release" -o /tmp/parity_ansi_c
          /tmp/parity_ansi_c "$RUNNER_TEMP/c_ansi_stats.txt" "$RUNNER_TEMP/c_ansi.bin"
          python3 bindings/parity/parity_ansi.py "$RUNNER_TEMP/py_ansi_stats.txt" "$RUNNER_TEMP/py_ansi.bin"
          echo "--- C ansi stats ---"; cat "$RUNNER_TEMP/c_ansi_stats.txt"
          echo "--- C ansi frame ---"; od -c "$RUNNER_TEMP/c_ansi.bin"
          cmp "$RUNNER_TEMP/c_ansi_stats.txt" "$RUNNER_TEMP/py_ansi_stats.txt"
          cmp "$RUNNER_TEMP/c_ansi_stats.txt" bindings/parity/golden_ansi_stats.txt
          cmp "$RUNNER_TEMP/c_ansi.bin" "$RUNNER_TEMP/py_ansi.bin"
          cmp "$RUNNER_TEMP/c_ansi.bin" bindings/parity/golden_ansi.bin

      - name: FFI color-depth downgrade parity (C vs Python vs native golden)
        # Drive the same headless frame op-script through the new gibson_set_color_depth setter at
        # each downgraded depth (mono / ansi16 / ansi256) and require a byte-identical painted ANSI
        # frame across the C ABI, the Python binding, and the committed per-depth golden the Rust
        # job verifies from the native API. Closes the Gate I truecolor-only cede (#142, v0.6
        # Gate J). Truecolor parity is already covered by the step above.
        env:
          PYTHONPATH: bindings/python
          LIBGIBSON_LIBRARY: ${{ github.workspace }}/target/release/libgibson.so
        run: |
          set -euo pipefail
          gcc -Iinclude bindings/parity/parity_depth.c -Ltarget/release -lgibson \
            -Wl,-rpath,"$GITHUB_WORKSPACE/target/release" -o /tmp/parity_depth_c
          for pair in "0:mono" "1:ansi16" "2:ansi256"; do
            d="${pair%%:*}"; name="${pair##*:}"
            /tmp/parity_depth_c "$d" "$RUNNER_TEMP/c_depth_$name.bin"
            python3 bindings/parity/parity_depth.py "$d" "$RUNNER_TEMP/py_depth_$name.bin"
            echo "--- $name (depth $d) frame ---"; od -c "$RUNNER_TEMP/c_depth_$name.bin"
            cmp "$RUNNER_TEMP/c_depth_$name.bin" "$RUNNER_TEMP/py_depth_$name.bin"
            cmp "$RUNNER_TEMP/c_depth_$name.bin" "bindings/parity/golden_depth_$name.bin"
          done

      - name: FFI styled cell-grid parity (C vs Python vs native golden)
        # Serialize the whole resolved styled cell grid of the canonical frame through the new
        # gibson_get_frame_size + gibson_get_frame_cell, via the C ABI and the Python binding, and
        # require a byte-identical serialization across both AND the committed golden the Rust job
        # verifies from the native API. Closes the styled-cell-grid half of the Gate I cede (#142,
        # v0.6 Gate J).
        env:
          PYTHONPATH: bindings/python
          LIBGIBSON_LIBRARY: ${{ github.workspace }}/target/release/libgibson.so
        run: |
          set -euo pipefail
          gcc -Iinclude bindings/parity/parity_cells.c -Ltarget/release -lgibson \
            -Wl,-rpath,"$GITHUB_WORKSPACE/target/release" -o /tmp/parity_cells_c
          /tmp/parity_cells_c "$RUNNER_TEMP/c_cells.txt"
          python3 bindings/parity/parity_cells.py "$RUNNER_TEMP/py_cells.txt"
          echo "--- C cells (head) ---"; head -8 "$RUNNER_TEMP/c_cells.txt"
          cmp "$RUNNER_TEMP/c_cells.txt" "$RUNNER_TEMP/py_cells.txt"
          cmp "$RUNNER_TEMP/c_cells.txt" bindings/parity/golden_cells.txt

      - name: FFI long-glyph cell-grid parity (C vs Python vs native golden)
        # Drive a frame with a 25-byte ZWJ family-emoji cluster (width 2, truncated by the 16-byte
        # inline cap) through the Gate K readback trio — bulk gibson_get_frame_cells, the
        # glyph_truncated flag, and gibson_get_frame_cell_glyph for the full bytes — via the C ABI
        # and the Python binding, and require a byte-identical serialization across both AND the
        # committed golden the Rust job verifies from the native API. This is the cross-language
        # proof that a truncated cluster + its full bytes marshal identically (#142, v0.6 Gate K).
        env:
          PYTHONPATH: bindings/python
          LIBGIBSON_LIBRARY: ${{ github.workspace }}/target/release/libgibson.so
        run: |
          set -euo pipefail
          gcc -Iinclude bindings/parity/parity_cells_long.c -Ltarget/release -lgibson \
            -Wl,-rpath,"$GITHUB_WORKSPACE/target/release" -o /tmp/parity_cells_long_c
          /tmp/parity_cells_long_c "$RUNNER_TEMP/c_cells_long.txt"
          python3 bindings/parity/parity_cells_long.py "$RUNNER_TEMP/py_cells_long.txt"
          echo "--- C long cells (head) ---"; head -5 "$RUNNER_TEMP/c_cells_long.txt"
          cmp "$RUNNER_TEMP/c_cells_long.txt" "$RUNNER_TEMP/py_cells_long.txt"
          cmp "$RUNNER_TEMP/c_cells_long.txt" bindings/parity/golden_cells_long.txt

  asan:
    name: AddressSanitizer (C, C++)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build release
        run: |
          cargo build --release
          # The cdylib carries an ELF SONAME of libgibson.so.1 (build.rs), so a
          # consumer that links the in-tree build output records NEEDED=libgibson.so.1
          # and needs that name present at runtime. The staged SDK ships the symlink;
          # mirror it next to the raw build output for in-tree C/C++ linkers.
          ln -sf libgibson.so target/release/libgibson.so.1

      - name: C example (ASan + UBSan)
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          gcc -Iinclude bindings/c/example.c \
            -fsanitize=address,undefined \
            -Ltarget/release -lgibson -Wl,-rpath,"$GITHUB_WORKSPACE/target/release" \
            -o /tmp/example_c_asan
          /tmp/example_c_asan

      - name: C++ example (ASan + UBSan)
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          g++ -std=c++17 -Iinclude bindings/cpp/example.cpp \
            -fsanitize=address,undefined \
            -Ltarget/release -lgibson -Wl,-rpath,"$GITHUB_WORKSPACE/target/release" \
            -o /tmp/example_cpp_asan
          /tmp/example_cpp_asan

  go:
    name: Go bindings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Stage native SDK (builds release, generates libgibson.pc)
        run: |
          scripts/release/stage-sdk.sh --prefix "$RUNNER_TEMP/sdk"
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/sdk/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/sdk/lib" >> "$GITHUB_ENV"

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false # No external Go modules/go.sum yet.

      - name: Vet
        working-directory: bindings/go
        run: go vet ./...

      - name: Test
        working-directory: bindings/go
        run: go test ./...

      - name: Build
        working-directory: bindings/go
        run: go build ./...

      - name: Example smoke
        working-directory: bindings/go
        run: go run ./cmd/example

  pty:
    name: PTY integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build examples (fresh binaries)
        run: cargo build --examples

      - name: PTY tests
        run: cargo test --test pty_integration --test pty_resize_torture --test event_pressure_pty -- --test-threads=1

      # The hangup tests are #[ignore]'d so they do NOT run in the main `rust` job's parallel
      # `cargo test`, where a loaded runner starves their liveness deadlines (a false failure
      # that is pure CPU contention, not a defect). Here they run SERIALLY in the dedicated PTY
      # environment, with --include-ignored to actually execute them. --include-ignored is scoped
      # to just these two binaries, so event_pressure_pty's own intentional #[ignore] is untouched.
      #
      # Serial isolation reduces but does not fully eliminate the starvation flake: a slow shared
      # runner VM can still blow the tests' own single-threaded 10s/15s liveness bounds. We therefore
      # allow a bounded retry (up to 3 attempts). Each attempt is self-bounded by the tests' own
      # wait_exit_code deadlines, so a genuine hang or regression fails ALL attempts and the step
      # fails — the retry tolerates transient CPU contention without masking a real defect.
      - name: PTY hangup tests (timing-sensitive; serial, bounded retry)
        run: |
          set +e
          attempts=3
          n=0
          until [ "$n" -ge "$attempts" ]; do
            n=$((n + 1))
            echo "::group::PTY hangup tests — attempt $n/$attempts"
            cargo test --test pty_hangup --test pty_hangup_restore -- --test-threads=1 --include-ignored
            rc=$?
            echo "::endgroup::"
            if [ "$rc" -eq 0 ]; then
              echo "PTY hangup tests passed on attempt $n/$attempts"
              exit 0
            fi
            echo "::warning::PTY hangup tests failed on attempt $n/$attempts (rc=$rc); retrying if attempts remain (timing-sensitive; transient CPU contention expected under load)"
          done
          echo "::error::PTY hangup tests failed on all $attempts attempts — not a transient flake; investigate a real hang or regression"
          exit 1

  msrv:
    name: MSRV (Rust 1.85, library)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.85 (declared MSRV)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.85"

      - name: Library check on MSRV (resolved-release floor, committed lock)
        run: cargo check --locked --lib

      - name: Declared-range consumer MSRV (fresh resolution)
        # Maintenance rule: a dependency upgrade must not silently raise the
        # effective MSRV. A fresh crates.io consumer of our DECLARED ranges (no
        # inherited lockfile) must still resolve to a graph that builds on the
        # floor. See docs/RELEASE_CONTRACT.md §5.
        run: MSRV_TOOLCHAIN="+1.85" scripts/release/msrv-consumer.sh
