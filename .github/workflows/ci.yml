name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build examples (fresh binaries for PTY/golden tests)
        run: cargo build --examples

      - name: Test
        run: cargo test

      - name: FX Lab generator tests
        run: cargo test --example fx_lab

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps

      - name: Build release
        run: cargo build --release

      - name: ABI baseline and package sanity
        run: |
          scripts/release/check-abi.sh
          cargo package --list --locked > /dev/null

  bindings:
    name: Bindings (C, C++, Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build release
        run: cargo build --release

      - name: C example
        run: |
          gcc -Iinclude bindings/c/example.c -Ltarget/release -lgibson -Wl,-rpath,"$GITHUB_WORKSPACE/target/release" -o /tmp/example_c
          /tmp/example_c

      - name: C++ example
        run: |
          g++ -std=c++17 -Iinclude bindings/cpp/example.cpp -Ltarget/release -lgibson -Wl,-rpath,"$GITHUB_WORKSPACE/target/release" -o /tmp/example_cpp
          /tmp/example_cpp

      - name: Python ctypes example
        env:
          PYTHONPATH: bindings/python
          LIBGIBSON_LIBRARY: ${{ github.workspace }}/target/release/libgibson.so
        run: python3 bindings/python/example.py

  asan:
    name: AddressSanitizer (C, C++)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build release
        run: cargo build --release

      - name: C example (ASan + UBSan)
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          gcc -Iinclude bindings/c/example.c \
            -fsanitize=address,undefined \
            -Ltarget/release -lgibson -Wl,-rpath,"$GITHUB_WORKSPACE/target/release" \
            -o /tmp/example_c_asan
          /tmp/example_c_asan

      - name: C++ example (ASan + UBSan)
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          g++ -std=c++17 -Iinclude bindings/cpp/example.cpp \
            -fsanitize=address,undefined \
            -Ltarget/release -lgibson -Wl,-rpath,"$GITHUB_WORKSPACE/target/release" \
            -o /tmp/example_cpp_asan
          /tmp/example_cpp_asan

  go:
    name: Go bindings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Stage native SDK (builds release, generates libgibson.pc)
        run: |
          scripts/release/stage-sdk.sh --prefix "$RUNNER_TEMP/sdk"
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/sdk/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/sdk/lib" >> "$GITHUB_ENV"

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false # No external Go modules/go.sum yet.

      - name: Vet
        working-directory: bindings/go
        run: go vet ./...

      - name: Test
        working-directory: bindings/go
        run: go test ./...

      - name: Build
        working-directory: bindings/go
        run: go build ./...

      - name: Example smoke
        working-directory: bindings/go
        run: go run ./cmd/example

  pty:
    name: PTY integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build examples (fresh binaries)
        run: cargo build --examples

      - name: PTY tests
        run: cargo test --test pty_integration --test pty_resize_torture --test event_pressure_pty -- --test-threads=1

  msrv:
    name: MSRV (Rust 1.85, library)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.85 (declared MSRV)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.85"

      - name: Library check on MSRV (resolved-release floor, committed lock)
        run: cargo check --locked --lib

      - name: Declared-range consumer MSRV (fresh resolution)
        # Maintenance rule: a dependency upgrade must not silently raise the
        # effective MSRV. A fresh crates.io consumer of our DECLARED ranges (no
        # inherited lockfile) must still resolve to a graph that builds on the
        # floor. See docs/RELEASE_CONTRACT.md §5.
        run: MSRV_TOOLCHAIN="+1.85" scripts/release/msrv-consumer.sh
