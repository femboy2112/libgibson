name: Release Preflight

# Publication-free release-candidate gate. Runs on demand and when release-shaping
# files change. It builds archives and stages the SDK but publishes nothing: no
# tags, no GitHub Releases, no registry uploads, no credentials.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/release/**"
      - "docs/RELEASE_CONTRACT.md"
      - "docs/RELEASING.md"
      - "CHANGELOG.md"
      - "abi/**"
      - "bindings/python/pyproject.toml"
      - "bindings/go/gibson/**"
      - ".github/workflows/release-preflight.yml"

permissions:
  contents: read

concurrency:
  group: release-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Release preflight (publication-free)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Install the MSRV toolchain first, then stable, so stable is the default
      # (`cargo`) and 1.85 is reachable as `cargo +1.85` by the preflight script.
      - name: Install Rust 1.85 (MSRV)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.85"

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Release preflight
        env:
          STABLE_TOOLCHAIN: ""
          MSRV_TOOLCHAIN: "+1.85"
        run: scripts/release/preflight.sh

      - name: Build release bundle (no publish)
        run: scripts/release/bundle.sh
