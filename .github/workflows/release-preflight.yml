name: Release Preflight

# Publication-free release-candidate gate. Runs on demand and when release-shaping
# files change. It builds archives and stages the SDK but publishes nothing: no
# tags, no GitHub Releases, no registry uploads, no credentials.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/release/**"
      - "docs/RELEASE_CONTRACT.md"
      - "docs/RELEASING.md"
      - "CHANGELOG.md"
      - "abi/**"
      - "bindings/python/pyproject.toml"
      - "bindings/go/gibson/**"
      - ".github/workflows/release-preflight.yml"

permissions:
  contents: read

concurrency:
  group: release-preflight-${{ github.ref }}
  cancel-in-progress: true

env:
  # Ephemeral runner: incremental cache is never reused, so disable it.
  CARGO_INCREMENTAL: "0"

jobs:
  preflight:
    name: Release preflight (publication-free)
    # Pinned to ubuntu-24.04 (not ubuntu-latest), mirroring the required Rust job in
    # ci.yml: preflight runs `cargo test`, which includes the byte-exact PCM goldens
    # in tests/audio_pocket_voice.rs. Those depend on the system libm, and the
    # ubuntu-latest roll to 26.04 changes libm's rounding in the last ULPs, failing
    # the frozen golden under ANY toolchain. The preflight must validate the release
    # on the SAME environment the goldens were captured on, not inherit a drifting
    # default runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Install the MSRV toolchain first, then the pinned comprehensive toolchain, so
      # the latter is the default (`cargo`) and 1.85 is reachable as `cargo +1.85` by
      # the preflight script.
      - name: Install Rust 1.85 (MSRV)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.85"

      # Pinned to 1.98.1 (the PCM goldens' capture toolchain), matching ci.yml's
      # required Rust job. The decisive variable for the audio goldens is the runner
      # OS (libm), pinned above; pinning the toolchain too keeps the preflight's
      # comprehensive lane byte-identical to the environment the release is gated on.
      - name: Install Rust 1.98.1 (comprehensive toolchain)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      # preflight.sh runs a `--all-features` clippy pass, which enables the optional
      # audio-cpal backend (cpal -> alsa-sys, needs ALSA dev headers at build time).
      - name: Install ALSA dev headers (for the optional audio-cpal feature)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Isolated preflight fault controls
        run: python3 scripts/release/tests/test-isolated-preflight.py

      - name: Release preflight
        env:
          STABLE_TOOLCHAIN: ""
          MSRV_TOOLCHAIN: "+1.85"
        run: scripts/release/preflight.sh

      - name: Build release bundle (no publish)
        run: scripts/release/bundle.sh
