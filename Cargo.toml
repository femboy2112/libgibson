[package]
name = "libgibson"
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
authors = ["LibGibson Contributors"]
description = "A language-neutral terminal UI engine with a real cell framebuffer, differential renderer, and immutable-scrollback / mutable-live-region semantics."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/femboy2112/libgibson"

# The published crate ships the Rust library plus the C header (for native-library
# builders) and the license/readme/design docs. The engineering-demo corpus
# (examples/, integration tests + goldens, internal docs/, dev scripts, and the
# language bindings — which are delivered via the separate native SDK) stays in the
# repository but is NOT part of the crate. See docs/RELEASE_CONTRACT.md.
exclude = [
    "/examples",
    "/tests",
    "/docs",
    "/scripts",
    "/bindings",
    "/.github",
    "/.gitignore",
]

[lib]
name = "gibson"
crate-type = ["cdylib", "rlib", "staticlib"]

[features]
default = []
# Optional real-audio-device output backend for the experimental `gibson::audio` axis.
# The pure-Rust audio core (DSP, scoring, the deterministic OFFLINE renderer, WAV output)
# needs NONE of this and is always compiled — so `cargo test`, headless builds, and CI
# runners without system audio libraries are unaffected. Enabling `audio-cpal` pulls cpal
# (real device I/O) and rtrb (a realtime-safe SPSC queue for the callback). On Linux cpal
# links ALSA unconditionally and requires `libasound2-dev` at BUILD time; that is exactly
# why this is opt-in and off by default.
#
# MSRV discipline: cpal 0.18.2 declares `rust-version = "1.85"` — the same value as our
# floor, i.e. ZERO headroom. It is pinned exactly here and MUST be re-verified against
# Rust 1.85 on any bump (a future cpal/alsa point release could raise its MSRV without a
# semver-major, silently breaking our floor). rtrb has a 1.38 MSRV (ample headroom).
audio-cpal = ["dep:cpal", "dep:rtrb"]

[dependencies]
taffy = "0.14"
crossterm = "0.29"
unicode-segmentation = "1.12"
unicode-width = "0.2"
compact_str = "0.10"
bitflags = "2.4"
libc = "0.2"
# Optional — only compiled under the `audio-cpal` feature (see [features] above).
cpal = { version = "=0.18.2", optional = true }
rtrb = { version = "0.3", optional = true }

[dev-dependencies]
portable-pty = "0.9"
vt100 = "0.16"

[[example]]
name = "agent_chat"
path = "examples/agent_chat.rs"

[[example]]
name = "perf_probe"
path = "examples/perf_probe.rs"

[[example]]
name = "hack_the_gibson"
path = "examples/hack_the_gibson.rs"

[[example]]
name = "polished_agent"
path = "examples/polished_agent.rs"

[[example]]
name = "fx_lab"
path = "examples/fx_lab.rs"

# HumanMusic analysis probe (beef-up round): dumps the composed Score — pitched notes + drum
# lanes WITH velocity and semantic provenance (section family, phrase, motif id/xform, anchor,
# discourse role, pitch function) to a unified TSV, so scripts/humanmusic_beefup/ can measure the
# engine with the same instrument as the reference corpus. See that dir's tools.
[[example]]
name = "human_music_probe"
path = "examples/human_music_probe.rs"

# Frozen A/B/C/D auditory-observer experiment (observer MVP): renders HumanMusic, derives
# three controlled perturbations, and reports per-witness AuditoryTrace distances + WAVs for
# maintainer listening. Analysis/listening instrument on the beef-up branch, not shipped.
[[example]]
name = "observer_abcd"
path = "examples/observer_abcd.rs"

# Recurrence dial listening renders (Wave 3): the same trace/world/seed/grammar rendered at each
# motif_repetition position (Develop / Return / Restate) + SongMap fingerprints, for maintainer
# listening. Listening instrument on the beef-up branch, not shipped.
[[example]]
name = "recurrence_ab"
path = "examples/recurrence_ab.rs"

# Dev/test builds keep line tables (so RUST_BACKTRACE still symbolicates file:line)
# but drop full type/variable DWARF. With ~50 integration-test binaries + examples
# each statically embedding the crate + a generics-heavy dep graph (taffy), full
# DWARF (`debug = 2`, the stock default) bloats `target/debug` to tens of GiB;
# line-tables-only cuts that dramatically at no cost to backtraces or test behavior.
# `[profile.test]` inherits `debug` from here. Release artifacts are unaffected
# (they build under `[profile.release]`).
[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
