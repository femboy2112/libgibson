[package]
name = "libgibson"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["LibGibson Contributors"]
description = "A language-neutral terminal UI engine with a real cell framebuffer, differential renderer, and immutable-scrollback / mutable-live-region semantics."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/femboy2112/libgibson"

# The published crate ships the Rust library plus the C header (for native-library
# builders) and the license/readme/design docs. The engineering-demo corpus
# (examples/, integration tests + goldens, internal docs/, dev scripts, and the
# language bindings — which are delivered via the separate native SDK) stays in the
# repository but is NOT part of the crate. See docs/RELEASE_CONTRACT.md.
exclude = [
    "/examples",
    "/tests",
    "/docs",
    "/scripts",
    "/bindings",
    "/.github",
    "/.gitignore",
]

[lib]
name = "gibson"
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
taffy = "0.14"
crossterm = "0.29"
unicode-segmentation = "1.12"
unicode-width = "0.2"
compact_str = "0.10"
bitflags = "2.4"
libc = "0.2"

[dev-dependencies]
portable-pty = "0.9"
vt100 = "0.16"

[[example]]
name = "agent_chat"
path = "examples/agent_chat.rs"

[[example]]
name = "perf_probe"
path = "examples/perf_probe.rs"

[[example]]
name = "hack_the_gibson"
path = "examples/hack_the_gibson.rs"

[[example]]
name = "polished_agent"
path = "examples/polished_agent.rs"

[[example]]
name = "fx_lab"
path = "examples/fx_lab.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
